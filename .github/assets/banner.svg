<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Browser Extensions by ThomasThanos">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1727"/><stop offset=".55" stop-color="#08121f"/><stop offset="1" stop-color="#060e18"/>
    </linearGradient>
    <radialGradient id="gm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#63e0c7" stop-opacity=".55"/><stop offset="1" stop-color="#63e0c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gs" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#71a8ff" stop-opacity=".55"/><stop offset="1" stop-color="#71a8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gr" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff8fab" stop-opacity=".38"/><stop offset="1" stop-color="#ff8fab" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="760" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#b9f2e4"/><stop offset="1" stop-color="#8fbcff"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="64" y1="0" x2="112" y2="0">
      <stop offset="0" stop-color="#63e0c7" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#71a8ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#71a8ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#9fb4d0" stroke-opacity=".05" stroke-width="1"/>
    </pattern>

    <clipPath id="clip"><rect x="0" y="0" width="1200" height="320" rx="26"/></clipPath>
  </defs>
  <style>
    @keyframes drift1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(26px,-16px) } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-22px,14px) } }
    @keyframes breathe { 0%,100% { opacity:.55 } 50% { opacity:.95 } }
    @keyframes sweepx  { 0% { transform: translateX(-560px) } 100% { transform: translateX(1360px) } }
    @keyframes floaty  { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
    .d1 { animation: drift1 15s ease-in-out infinite; }
    .d2 { animation: drift2 19s ease-in-out infinite; }
    .br { animation: breathe 8s ease-in-out infinite; }
    .sw { animation: sweepx 9s linear infinite; }
    .f1 { animation: floaty 7s ease-in-out infinite; }
    .f2 { animation: floaty 7s ease-in-out infinite .9s; }
    .f3 { animation: floaty 7s ease-in-out infinite 1.8s; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#card)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <g class="d1"><ellipse cx="120" cy="20" rx="420" ry="260" fill="url(#gm)"/></g>
    <g class="d2"><ellipse cx="1080" cy="40" rx="440" ry="280" fill="url(#gs)"/></g>
    <ellipse cx="700" cy="330" rx="380" ry="180" fill="url(#gr)"/>

    <g opacity=".9" transform="translate(902,44)">
      <g class="f1"><rect x="0" y="34" width="94" height="94" rx="26" fill="#ffffff" fill-opacity=".05" stroke="url(#hair)" stroke-width="1.2" transform="rotate(-9 47 81)"/></g>
      <g class="f2"><rect x="86" y="8" width="94" height="94" rx="26" fill="#ffffff" fill-opacity=".05" stroke="url(#hair)" stroke-width="1.2" transform="rotate(6 133 55)"/></g>
      <g class="f3"><rect x="150" y="112" width="94" height="94" rx="26" fill="#ffffff" fill-opacity=".05" stroke="url(#hair)" stroke-width="1.2" transform="rotate(-4 197 159)"/></g>
    </g>

    <rect class="sw" x="-560" y="0" width="560" height="320" fill="url(#sweep)"/>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="318.5" rx="26" fill="none" stroke="url(#hair)" stroke-width="1.5"/>

  <g font-family='"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif'>
    <rect x="64" y="52" width="46" height="3" rx="1.5" fill="url(#rule)" class="br"/>
    <text x="64" y="88" font-size="13.5" font-weight="700" letter-spacing="3.1" fill="#63e0c7" fill-opacity=".95">SOURCE-AVAILABLE &#183; MANIFEST V3</text>
    <text x="62" y="164" font-size="62" font-weight="800" letter-spacing="-1.6" fill="url(#title)">Browser Extensions</text>
    <text x="64" y="206" font-size="21" font-weight="500" fill="#a8b6cb">Four extensions for Chrome &amp; Edge by ThomasThanos &#183; no trackers, no ads, no telemetry.</text>
    <g>
      <rect x="64" y="244" width="196" height="40" rx="20" fill="#ffffff" fill-opacity=".045"/>
      <rect x="64" y="244" width="196" height="40" rx="20" fill="none" stroke="url(#hair)" stroke-width="1.1"/>
      <circle cx="85" cy="264" r="4.5" fill="#63e0c7"/>
      <text x="100" y="269.5" font-family='"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif' font-size="15.5" font-weight="600" fill="#e2ebf8">An1me.to Tracker</text>
    </g>
    <g>
      <rect x="274" y="244" width="204" height="40" rx="20" fill="#ffffff" fill-opacity=".045"/>
      <rect x="274" y="244" width="204" height="40" rx="20" fill="none" stroke="url(#hair)" stroke-width="1.1"/>
      <circle cx="295" cy="264" r="4.5" fill="#ffb84e"/>
      <text x="310" y="269.5" font-family='"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif' font-size="15.5" font-weight="600" fill="#e2ebf8">NexusMods Bypass</text>
    </g>
    <g>
      <rect x="492" y="244" width="140" height="40" rx="20" fill="#ffffff" fill-opacity=".045"/>
      <rect x="492" y="244" width="140" height="40" rx="20" fill="none" stroke="url(#hair)" stroke-width="1.1"/>
      <circle cx="513" cy="264" r="4.5" fill="#ff8fab"/>
      <text x="528" y="269.5" font-family='"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif' font-size="15.5" font-weight="600" fill="#e2ebf8">Auto Liker</text>
    </g>
    <g>
      <rect x="646" y="244" width="172" height="40" rx="20" fill="#ffffff" fill-opacity=".045"/>
      <rect x="646" y="244" width="172" height="40" rx="20" fill="none" stroke="url(#hair)" stroke-width="1.1"/>
      <circle cx="667" cy="264" r="4.5" fill="#71a8ff"/>
      <text x="682" y="269.5" font-family='"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif' font-size="15.5" font-weight="600" fill="#e2ebf8">Speed Control</text>
    </g>
  </g>
</svg>
